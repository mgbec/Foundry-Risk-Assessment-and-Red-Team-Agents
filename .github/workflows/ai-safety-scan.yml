name: AI Safety & Red Team Scan

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}     # allow manual trigger
  push:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  id-token: write   # required for OIDC federated login (no stored secrets)
  contents: read

jobs:
  terraform:
    name: Provision / update infra
    runs-on: ubuntu-latest
    outputs:
      project_endpoint: ${{ steps.tf_out.outputs.project_endpoint }}
      target_deployment: ${{ steps.tf_out.outputs.target_deployment }}
      adversarial_deployment: ${{ steps.tf_out.outputs.adversarial_deployment }}
      storage_account: ${{ steps.tf_out.outputs.storage_account }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - run: terraform init
      - run: terraform apply -auto-approve
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: tf_out
        run: |
          echo "project_endpoint=$(terraform output -raw ai_foundry_project_endpoint)" >> "$GITHUB_OUTPUT"
          echo "target_deployment=$(terraform output -raw target_model_deployment_name)" >> "$GITHUB_OUTPUT"
          echo "adversarial_deployment=$(terraform output -raw adversarial_model_deployment_name)" >> "$GITHUB_OUTPUT"
          echo "storage_account=$(terraform output -raw results_storage_account)" >> "$GITHUB_OUTPUT"

  scan:
    name: Run risk assessment + red team scan
    needs: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # PyRIT requires 3.10-3.13

      - run: pip install -r requirements.txt

      - name: Run orchestrator
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_AI_PROJECT_ENDPOINT: ${{ needs.terraform.outputs.project_endpoint }}
          TARGET_MODEL_DEPLOYMENT: ${{ needs.terraform.outputs.target_deployment }}
          ADVERSARIAL_MODEL_DEPLOYMENT: ${{ needs.terraform.outputs.adversarial_deployment }}
          RESULTS_STORAGE_ACCOUNT: ${{ needs.terraform.outputs.storage_account }}
        run: python orchestrator.py

      - name: Upload scorecards as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: safety-scorecards
          path: agent/results/*.json
